{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
{% include "_nav.html" %}

<h1>{{ title }}</h1>

{% if is_admin and has_solution %}
<div class="flash info">
    <a href="/labs/{{ lab_id }}/solution">View worked solution (admin only)</a>
</div>
{% endif %}

<div class="markdown-body">
    {{ content | safe }}
</div>

<div class="mt-3">
    <a href="/labs" class="btn btn-outline">Back to Labs</a>
</div>
{% endblock %}
